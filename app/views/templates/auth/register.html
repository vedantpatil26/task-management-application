{% extends 'base.html' %}
{% block title %}Register — TaskMaster{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-panel">
    <div class="auth-header">
      <div class="auth-logo">⬡</div>
      <h1>Create Account</h1>
      <p>Join TaskMaster today</p>
    </div>
    <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" required placeholder="Your full name"
               value="{{ full_name or '' }}">
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required placeholder="Choose a username"
               value="{{ username or '' }}">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="your@email.com"
               value="{{ email or '' }}">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Min. 6 characters">
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repeat password">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Create Account</button>
    </form>
    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
