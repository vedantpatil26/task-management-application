{% extends 'base.html' %}
{% block title %}Edit Task — TaskMaster{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <div class="breadcrumb"><a href="{{ url_for('tasks.list_tasks') }}">Tasks</a> / <a href="{{ url_for('tasks.detail', task_id=task.id) }}">#{{ task.id }}</a> / Edit</div>
    <h1 class="page-title">Edit Task</h1>
  </div>
</div>

<div class="form-container">
  <div class="form-card">
    <form method="POST" action="{{ url_for('tasks.edit', task_id=task.id) }}">
      <div class="form-group">
        <label for="title">Task Title <span class="required">*</span></label>
        <input type="text" id="title" name="title" required placeholder="Enter task title" value="{{ task.title }}">
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" placeholder="Describe the task...">{{ task.description or '' }}</textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="due_date">Due Date</label>
          <input type="date" id="due_date" name="due_date"
                 value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date else '' }}">
        </div>

        <div class="form-group">
          <label for="status">Status <span class="required">*</span></label>
          <select id="status" name="status">
            {% for s in statuses %}
            <option value="{{ s.name }}" {% if s == task.status %}selected{% endif %}>{{ s.value }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="remarks">Remarks</label>
        <textarea id="remarks" name="remarks" rows="3" placeholder="Any additional remarks...">{{ task.remarks or '' }}</textarea>
      </div>

      <div class="audit-info">
        <span>Created by <strong>Admin</strong> on {{ task.created_on.strftime('%d %b %Y, %H:%M') }}</span>
      </div>

      <div class="form-actions">
        <a href="{{ url_for('tasks.detail', task_id=task.id) }}" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
