<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}TaskMaster{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a href="{{ url_for('main.dashboard') }}" class="nav-brand">
      <span class="brand-icon">⬡</span> TaskMaster
    </a>
    <div class="nav-links">
      <a href="{{ url_for('main.dashboard') }}" class="nav-link {% if request.endpoint == 'main.dashboard' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('tasks.list_tasks') }}" class="nav-link {% if request.blueprint == 'tasks' and request.endpoint != 'tasks.search' %}active{% endif %}">Tasks</a>
      <a href="{{ url_for('tasks.search') }}" class="nav-link {% if request.endpoint == 'tasks.search' %}active{% endif %}">Search</a>
      <a href="{{ url_for('tasks.create') }}" class="btn-nav">+ New Task</a>
      <div class="nav-user">
        <span class="user-avatar">A</span>
        <span class="user-name">Admin</span>
      </div>
    </div>
  </nav>

  <main class="main-content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="alerts">
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
              <span>{{ message }}</span>
              <button class="alert-close" onclick="this.parentElement.remove()">×</button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
